<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Learning Studio — Le Nouveau Taxi ! 1 (Leçons 7–12)</title>
<style>
:root{
  --bg:#f2f7fd; --card:#ffffff; --ink:#1b2a3a; --muted:#5c738c;
  --blue:#3f7fd4; --blue-l:#e4efff; --blue-d:#1f4e8c;
  --ok:#17724a; --ok-bg:#e5f6ed; --bad:#b3261e; --bad-bg:#fdeceb;
  --warn:#8a5a00; --warn-bg:#fff5e0;
  --line:#d8e4f2; --radius:16px;
  --shadow:0 6px 22px rgba(31,74,133,.09);
  --fs:16px;
}
body.dark{
  --bg:#0f1720; --card:#17222e; --ink:#e7eef7; --muted:#9db1c7;
  --blue:#6aa6ee; --blue-l:#1d3247; --blue-d:#a9cbf5;
  --line:#243447; --shadow:0 6px 22px rgba(0,0,0,.35);
  --ok-bg:#12301f; --bad-bg:#331513; --warn-bg:#33280f;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  line-height:1.55;
}
a{color:var(--blue-d)}
button{font-family:inherit;font-size:1rem}
:focus-visible{outline:3px solid #f2a33c; outline-offset:2px; border-radius:6px}

header.appbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#3f7fd4,#6ea8e8);
  color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem;
  box-shadow:0 3px 14px rgba(31,74,133,.25);
}
body.dark header.appbar{background:linear-gradient(135deg,#1b3a5c,#2c5a8c)}
header.appbar h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.2px}
header.appbar .sub{font-size:.75rem;opacity:.92;display:block;font-weight:400}
.brand{flex:1;min-width:0}
.brand span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:10px;padding:.45rem .7rem;cursor:pointer;
}
.iconbtn:hover{background:rgba(255,255,255,.3)}
#menuBtn{display:none}

.layout{display:flex;min-height:calc(100vh - 58px)}
nav.sidebar{
  width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);
  padding:1rem .7rem;overflow-y:auto;max-height:calc(100vh - 58px);position:sticky;top:58px;
}
nav.sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:1rem .5rem .4rem}
.navbtn{
  display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
  background:transparent;border:0;border-radius:12px;padding:.6rem .7rem;
  cursor:pointer;color:var(--ink);font-size:.94rem;
}
.navbtn:hover{background:var(--blue-l)}
.navbtn.active{background:var(--blue);color:#fff;font-weight:600}
.navbtn .em{font-size:1.05rem}
main#main{flex:1;padding:1.2rem;max-width:1200px;margin:0 auto;width:100%;min-width:0}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.1rem 1.2rem;box-shadow:var(--shadow);margin-bottom:1rem;
}
.card h2{margin:.1rem 0 .7rem;font-size:1.25rem}
.card h3{margin:1rem 0 .5rem;font-size:1.05rem;color:var(--blue-d)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{
  background:var(--blue-l);border-radius:14px;padding:.8rem .9rem;border:1px solid var(--line);
}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--blue-d);line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}
.btn{
  background:var(--blue);color:#fff;border:0;border-radius:12px;padding:.6rem 1rem;
  cursor:pointer;font-weight:600;transition:transform .08s,filter .15s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--blue-l);color:var(--blue-d);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--blue-d);border:1px dashed var(--line)}
.btn.danger{background:#c0392b}
.btn.sm{padding:.38rem .7rem;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.pill{
  display:inline-block;background:var(--blue-l);color:var(--blue-d);
  border-radius:999px;padding:.15rem .65rem;font-size:.78rem;font-weight:600;
}
.muted{color:var(--muted)}
small.muted{font-size:.82rem}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--blue-l);color:var(--blue-d);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:rgba(63,127,212,.05)}
.fr{font-weight:600;color:var(--blue-d)}

.opt{
  display:block;width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.45rem 0;
  cursor:pointer;transition:.15s;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:.7rem .9rem;margin-top:.7rem;font-size:.93rem;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.progressbar{height:9px;background:var(--blue-l);border-radius:999px;overflow:hidden;margin:.5rem 0 1rem}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,#3f7fd4,#7cb6f0);width:0;transition:width .3s}
input[type=text],textarea,select{
  width:100%;padding:.6rem .7rem;border:2px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;
}
textarea{min-height:130px;resize:vertical}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--blue)}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.chip{
  background:var(--blue-l);border:1px solid var(--line);border-radius:10px;
  padding:.35rem .7rem;cursor:pointer;font-size:.92rem;
}
.chip:hover{background:#cfe3ff}
.drop{
  min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:.5rem;
  display:flex;flex-wrap:wrap;gap:.4rem;background:rgba(63,127,212,.04)
}
.chip.in{background:#fff;border-color:var(--blue);cursor:pointer}

/* ---------- FLASHCARD ---------- */
.flashwrap{perspective:1200px;max-width:560px;margin:0 auto}
.flash{
  position:relative;min-height:230px;border-radius:20px;transform-style:preserve-3d;
  transition:transform .55s;cursor:pointer;
}
.flash.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;
  background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.2rem;text-align:center;
}
.face.back{transform:rotateY(180deg);background:var(--blue-l)}
.face .big{font-size:1.6rem;font-weight:800;color:var(--blue-d)}
.face .vi{font-size:1.2rem;font-weight:700}

/* Flashcard modes */
.fc-modes{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.fc-mode{
  background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:.5rem .8rem;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:.4rem;transition:.15s;
}
.fc-mode:hover{border-color:var(--blue);background:var(--blue-l)}
.fc-mode.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.fc-mode small{font-weight:400;opacity:.8;font-size:.72rem;display:block;text-align:left}

.fc-stats{display:flex;flex-wrap:wrap;gap:.6rem;margin:.7rem 0}
.fc-stat{
  background:var(--blue-l);border-radius:10px;padding:.35rem .7rem;font-size:.82rem;
  border:1px solid var(--line);
}
.fc-stat strong{color:var(--blue-d);font-size:1rem}

/* Matching grid */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.7rem}
.match-col{display:flex;flex-direction:column;gap:.4rem}
.match-card{
  background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:.65rem .8rem;cursor:pointer;text-align:left;font-size:.92rem;transition:.15s;
}
.match-card:hover{border-color:var(--blue);background:var(--blue-l)}
.match-card.sel{border-color:var(--blue);background:var(--blue-l);font-weight:700}
.match-card.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default;opacity:.7}
.match-card.err{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Speed round */
.speed-timer{
  font-size:2rem;font-weight:800;text-align:center;color:var(--blue-d);
  font-variant-numeric:tabular-nums;margin:.3rem 0;
}
.speed-timer.warn{color:#c07a1a}
.speed-timer.danger{color:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.wsgrid{display:grid;gap:2px;justify-content:center;margin:.7rem auto;user-select:none}
.wscell{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--blue-l);border-radius:5px;font-weight:700;font-size:.82rem;cursor:pointer;
}
.wscell.sel{background:#f2a33c;color:#fff}
.wscell.found{background:var(--ok);color:#fff}

.toast{
  position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);
  background:#1b2a3a;color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:99;
  box-shadow:0 8px 22px rgba(0,0,0,.3);font-size:.9rem;max-width:90vw;
}
.bar{height:12px;background:var(--blue-l);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3f7fd4,#7cb6f0)}
ul.tight{margin:.3rem 0 .3rem 1.1rem;padding:0}
ul.tight li{margin:.18rem 0}
.tag{font-size:.72rem;background:var(--blue-l);color:var(--blue-d);padding:.1rem .5rem;border-radius:8px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:1rem}
.modal{background:var(--card);border-radius:18px;padding:1.2rem;max-width:520px;width:100%;box-shadow:var(--shadow)}

@media (max-width:900px){
  #menuBtn{display:inline-block}
  nav.sidebar{
    position:fixed;top:58px;left:0;bottom:0;z-index:60;transform:translateX(-105%);
    transition:transform .25s;max-height:none;
  }
  nav.sidebar.open{transform:translateX(0)}
  main#main{padding:.85rem}
  .wscell{width:22px;height:22px;font-size:.72rem}
  .match-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="appbar">
  <button id="menuBtn" class="iconbtn" aria-label="Mở menu">☰</button>
  <div class="brand">
    <span><h1 style="display:inline">French Learning Studio</h1></span>
    <span class="sub">Le Nouveau Taxi ! 1 · Leçons 7–12 | Vocabulaire • Grammaire • Compréhension • Communication</span>
  </div>
  <button class="iconbtn" id="themeBtn" title="Chế độ sáng/tối" aria-label="Chế độ sáng tối">🌓</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính">
    <h2>Học tập</h2>
    <button class="navbtn" data-nav="dashboard"><span class="em">🏠</span> Bảng điều khiển</button>
    <button class="navbtn" data-nav="lessons"><span class="em">📚</span> Bài học (L7–L12)</button>
    <button class="navbtn" data-nav="vocab"><span class="em">🔤</span> Từ vựng</button>
    <button class="navbtn" data-nav="grammar"><span class="em">📐</span> Ngữ pháp</button>
    <button class="navbtn" data-nav="flashcards"><span class="em">🃏</span> Flashcards</button>
    <h2>Luyện tập</h2>
    <button class="navbtn" data-nav="practice"><span class="em">✏️</span> Bài tập</button>
    <button class="navbtn" data-nav="listening"><span class="em">🎧</span> Nghe</button>
    <button class="navbtn" data-nav="reading"><span class="em">📖</span> Đọc hiểu</button>
    <button class="navbtn" data-nav="writing"><span class="em">🖊️</span> Viết</button>
    <button class="navbtn" data-nav="speaking"><span class="em">🗣️</span> Nói</button>
    <button class="navbtn" data-nav="extra"><span class="em">⚙️</span> Tạo bài tập thêm</button>
    <h2>Đánh giá</h2>
    <button class="navbtn" data-nav="mistakes"><span class="em">❌</span> Ôn lỗi sai</button>
    <button class="navbtn" data-nav="final"><span class="em">🏁</span> Bài kiểm tra cuối</button>
    <button class="navbtn" data-nav="progress"><span class="em">📈</span> Tiến độ</button>
    <h2>Khác</h2>
    <button class="navbtn" data-nav="settings"><span class="em">⚙️</span> Cài đặt</button>
  </nav>

  <main id="main" tabindex="-1"></main>
</div>

<script>
/* =========================================================================
   FRENCH LEARNING STUDIO — Le Nouveau Taxi ! 1, Leçons 7–12
   ========================================================================= */

/* ------------------------- 1. HELPERS ------------------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[’‘]/g,"'")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function stripArt(s){return norm(s).replace(/^(un|une|des|le|la|les|l')\s*/,"");}
function looseEq(a,b){
  if(norm(a)===norm(b)) return true;
  return stripArt(a)===stripArt(b);
}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function rand(n){return Math.floor(Math.random()*n);}
function toast(msg,ms=2600){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),ms);
}
function pct(c,t){return t?Math.round(c*100/t):0;}

/* ------------------------- 2. LESSON META ------------------------- */
const LESSONS = [
  {id:7, unit:"Unité 2", title:"Shopping", vi:"Mua sắm",
   obj:["Nhận biết và sử dụng từ vựng về quần áo, phụ kiện và màu sắc.","Dùng tính từ chỉ định (ce, cet, cette, ces) và tính từ nghi vấn (quel, quelle…).","Hỏi giá, hỏi cỡ và nói giá tiền.","Đếm và viết số từ 70 đến 1000.","Đặt câu phủ định với ne … pas."]},
  {id:8, unit:"Unité 2", title:"Le coin des artistes", vi:"Góc nghệ sĩ",
   obj:["Nói về nghề nghiệp nghệ thuật và các tác phẩm nghệ thuật.","Mô tả vị trí bằng giới từ chỉ nơi chốn.","Sử dụng đại từ nhấn mạnh (pronoms toniques) số ít.","Mô tả ngoại hình và trang phục của một người."]},
  {id:9, unit:"Unité 3", title:"Appartement à louer", vi:"Căn hộ cho thuê",
   obj:["Nắm từ vựng về nhà ở và các phòng trong căn hộ.","Đọc và hiểu một mẩu tin rao thuê nhà có viết tắt.","Sử dụng đại từ nhấn mạnh số nhiều (nous, vous, eux, elles).","Đặt câu hỏi với Où và dùng giới từ chỉ vị trí."]},
  {id:10, unit:"Unité 3", title:"C'est par où ?", vi:"Đi đường nào?",
   obj:["Gọi tên các địa điểm công cộng và đường phố.","Dùng thức mệnh lệnh (impératif) để chỉ đường.","Chia động từ prendre ở hiện tại.","Dùng mạo từ rút gọn (au, aux, du, des) và đại từ y."]},
  {id:11, unit:"Unité 3", title:"Bon voyage !", vi:"Chúc chuyến đi vui vẻ!",
   obj:["Nắm từ vựng về du lịch, khách sạn và giải trí.","Định vị địa lý với au nord de, au sud de…","Dùng cấu trúc C'est + danh từ/tính từ/địa điểm.","Hiểu hai giá trị của đại từ On (nous / les gens)."]},
  {id:12, unit:"Unité 3", title:"Marseille", vi:"Marseille",
   obj:["Biết các địa danh du lịch nổi tiếng của Marseille.","Nói về phương tiện di chuyển trong chuyến đi.","Viết một tấm bưu thiếp kể về kỳ nghỉ.","Ôn tập tổng hợp ngữ pháp Unité 2–3."]}
];

/* ------------------------- 3. VOCABULARY ------------------------- */
const VOCAB = {
7:[
{w:"un pantalon",v:"quần dài",ipa:"[pɑ̃talɔ̃]",p:"n.m.",e:"Ce pantalon est trop grand.",ev:"Cái quần này quá rộng."},
{w:"une robe",v:"váy, đầm",ipa:"[ʁɔb]",p:"n.f.",e:"Cette robe est très jolie.",ev:"Chiếc váy này rất đẹp."},
{w:"un pull",v:"áo len",ipa:"[pyl]",p:"n.m.",e:"Je cherche un pull bleu.",ev:"Tôi đang tìm một chiếc áo len màu xanh."},
{w:"un blouson",v:"áo khoác ngắn",ipa:"[bluzɔ̃]",p:"n.m.",e:"Ce blouson est en cuir.",ev:"Chiếc áo khoác ngắn này bằng da."},
{w:"une chemise",v:"áo sơ mi",ipa:"[ʃəmiz]",p:"n.f.",e:"Il porte une chemise blanche.",ev:"Anh ấy mặc một chiếc sơ mi trắng."},
{w:"un tee-shirt",v:"áo phông",ipa:"[tiʃœʁt]",p:"n.m.",e:"Le tee-shirt coûte quinze euros.",ev:"Chiếc áo phông giá mười lăm euro."},
{w:"un manteau",v:"áo măng tô, áo khoác dài",ipa:"[mɑ̃to]",p:"n.m.",e:"En hiver, je porte un manteau.",ev:"Mùa đông tôi mặc áo khoác dài."},
{w:"un jean",v:"quần bò",ipa:"[dʒin]",p:"n.m.",e:"Ce jean est trop petit.",ev:"Chiếc quần bò này quá nhỏ."},
{w:"des chaussures",v:"giày",ipa:"[ʃosyʁ]",p:"n.f.pl.",e:"Ces chaussures sont bon marché.",ev:"Đôi giày này rẻ."},
{w:"des baskets",v:"giày thể thao",ipa:"[baskɛt]",p:"n.f.pl.",e:"Elle adore ses baskets blanches.",ev:"Cô ấy rất thích đôi giày thể thao trắng của mình."},
{w:"des lunettes",v:"kính (đeo mắt)",ipa:"[lynɛt]",p:"n.f.pl.",e:"Il porte des lunettes noires.",ev:"Anh ấy đeo kính đen."},
{w:"un sac",v:"túi xách",ipa:"[sak]",p:"n.m.",e:"Ce sac à main est cher.",ev:"Chiếc túi xách này đắt."},
{w:"un chapeau",v:"mũ",ipa:"[ʃapo]",p:"n.m.",e:"Elle achète un chapeau jaune.",ev:"Cô ấy mua một chiếc mũ vàng."},
{w:"bleu",v:"màu xanh dương",ipa:"[blø]",p:"adj.",e:"J'aime la robe bleue.",ev:"Tôi thích chiếc váy màu xanh dương."},
{w:"gris",v:"màu xám",ipa:"[gʁi]",p:"adj.",e:"Le pull gris est doux.",ev:"Chiếc áo len màu xám mềm."},
{w:"noir",v:"màu đen",ipa:"[nwaʁ]",p:"adj.",e:"Ces lunettes sont noires.",ev:"Chiếc kính này màu đen."},

/* ------------------------- 15. STATE ------------------------- */
const LS_KEY = "fls_taxi1_v2";
const DEFAULT_STATE = {
  xp:0, sessions:0, streak:0, lastStudyDate:null, lastLesson:null, lastActivity:null,
  stats:{vocab:{c:0,t:0},grammar:{c:0,t:0},communication:{c:0,t:0},reading:{c:0,t:0},listening:{c:0,t:0}},
  lessonStats:{}, mistakes:{}, vocabStatus:{}, finalResults:[],
  fcPrefs:{mode:"flip", lesson:"all", status:"all"},
  settings:{dark:false, font:16, sound:true}
};
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), s);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function todayStr(){return new Date().toISOString().slice(0,10);}
function touchSession(){
  const t = todayStr();
  if(state.lastStudyDate === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak = (state.lastStudyDate === y) ? (state.streak+1) : 1;
  state.lastStudyDate = t; state.sessions += 1; saveState();
}
function recordAnswer(q, correct, userAns){
  touchSession();
  const sk = q.skill || "vocab";
  if(!state.stats[sk]) state.stats[sk]={c:0,t:0};
  state.stats[sk].t++; if(correct) state.stats[sk].c++;
  if(!state.lessonStats[q.lesson]) state.lessonStats[q.lesson]={c:0,t:0};
  state.lessonStats[q.lesson].t++; if(correct) state.lessonStats[q.lesson].c++;
  state.xp += correct ? 10 : 2;
  state.lastLesson = q.lesson;
  state.lastActivity = new Date().toLocaleString("vi-VN");
  if(!correct){
    const prev = state.mistakes[q.id];
    state.mistakes[q.id] = { id:q.id, lesson:q.lesson, skill:q.skill, topic:q.topic,
      q:q.q, options:q.options||null, answer:q.answer, explain:q.explain,
      yourAnswer:userAns||"", count: prev?prev.count+1:1, resolved:false };
  } else if(state.mistakes[q.id]){ state.mistakes[q.id].resolved = true; }
  saveState();
}

/* ------------------------- 16. AUDIO / TTS ------------------------- */
let frVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  frVoice = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("fr")) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if(!state.settings.sound){ toast("Âm thanh đang tắt trong Cài đặt."); return; }
  if(!("speechSynthesis" in window)){ toast("Trình duyệt không hỗ trợ đọc văn bản (TTS)."); return; }
  pickVoice();
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = rate || 0.88;
    if(frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  }catch(e){ toast("Không thể phát âm thanh."); }
}
function audioUnavailableNotice(){
  if("speechSynthesis" in window){
    if(frVoice) return '<p class="muted">🔊 Ứng dụng dùng giọng đọc tổng hợp của trình duyệt (không phải bản thu của người thật). Hãy bấm nút loa để nghe.</p>';
    return '<p class="muted">🔊 Trình duyệt chưa có giọng tiếng Pháp. Bạn vẫn có thể đọc transcript bên dưới.</p>';
  }
  return '<p class="muted">🔊 Trình duyệt không hỗ trợ đọc văn bản. Vui lòng dùng transcript.</p>';
}

  {id:"listening", icon:"🎧", label:"Nghe",     desc:"Nghe và chọn từ đúng"},
  {id:"speed",     icon:"⚡", label:"Đua tốc độ", desc:"60 giây, trả lời nhiều nhất"},
  {id:"matching",  icon:"🔗", label:"Nối cặp",  desc:"Nối từ Pháp với nghĩa Việt"}
];

let fcState = {
  mode: "flip",
  deck: [],
  idx: 0,
  flipped: false,
  answered: false,
  chosen: null,
  mcqOpts: [],
  listenOpts: [],
  typed: "",
  session: { studied:0, correct:0, wrong:0 },
  speed: { timeLeft:60, timer:null, active:false, score:0, wrong:0 },
  matching: { left:[], right:[], selL:null, selR:null, matched:[], wrongPair:null, done:0 }
};
let fcTimer = null;

function fcStatusOf(c){ return state.vocabStatus[c.lesson+"|"+c.w] || ""; }
function fcMarkFlag(c, flag){
  const key = c.lesson+"|"+c.w;
  let s = state.vocabStatus[key] || "";
  s = (s.indexOf(flag) >= 0) ? s.replace(flag,"") : (s + flag);
  state.vocabStatus[key] = s;
  saveState();
}
function fcStatusChip(st){
  if(!st) return '<span class="tag" style="opacity:.7">chưa đánh dấu</span>';
  const parts = [];
  if(st.indexOf("known")>=0)     parts.push('<span class="tag" style="background:#17724a;color:#fff">✅ đã biết</span>');
  if(st.indexOf("difficult")>=0) parts.push('<span class="tag" style="background:#c07a1a;color:#fff">⚠️ khó</span>');
  if(st.indexOf("fav")>=0)       parts.push('<span class="tag" style="background:#b8447a;color:#fff">⭐ yêu thích</span>');
  return parts.join(" ");
}
function fcFilterDeck(){
  const lesson = $("#fcLesson") ? $("#fcLesson").value : "all";
  const status = $("#fcStatus") ? $("#fcStatus").value : "all";
  const kw = $("#fcSearch") ? norm($("#fcSearch").value) : "";
  let pool = ALL_VOCAB.slice();
  if(lesson !== "all") pool = pool.filter(x => x.lesson === Number(lesson));
  if(status !== "all"){
    pool = pool.filter(x => {
      const s = fcStatusOf(x);
      if(status === "new") return !s;
      return s.indexOf(status) >= 0;
    });
  }
  if(kw) pool = pool.filter(x => norm(x.w).includes(kw) || norm(x.v).includes(kw));
  // Ưu tiên thẻ khó lên đầu
  const diff = pool.filter(x=>fcStatusOf(x).indexOf("difficult")>=0);
  const rest = pool.filter(x=>fcStatusOf(x).indexOf("difficult")<0);
  return shuffle(diff).concat(shuffle(rest));
}

  const modesBox = $("#fcModes");

    b.addEventListener("click", ()=>{
      if(fcState.speed.active) stopSpeedRound();
      fcState.mode = m.id;
      state.fcPrefs.mode = m.id; saveState();
      renderFlashcards();
    });
    modesBox.appendChild(b);
  });

  // Restore pref selects
  if(pref.lesson) $("#fcLesson").value = pref.lesson;
  if(pref.status) $("#fcStatus").value = pref.status;

  $("#fcStatus").addEventListener("change", e=>{ state.fcPrefs.status = e.target.value; saveState(); });

  $("#fcStart").addEventListener("click", fcStart);
  $("#fcShuffleBtn").addEventListener("click", ()=>{
    if(fcState.deck.length){ fcState.deck = shuffle(fcState.deck); fcState.idx = 0; fcRenderCurrent(); toast("Đã xáo trộn."); }
    else toast("Chưa có deck — hãy bắt đầu phiên học trước.");
  });
  $("#fcResetSession").addEventListener("click", ()=>{
    fcState.session = { studied:0, correct:0, wrong:0 };
    fcState.deck = []; fcState.idx = 0;
    $("#fcArea").innerHTML = '<p class="muted">Nhấn « Bắt đầu phiên học » để bắt đầu.</p>';

    toast("Đã đặt lại phiên học.");

  if(fcState.deck.length){

function fcStart(){
  const deck = fcFilterDeck();
  if(!deck.length){ toast("Không có thẻ nào phù hợp bộ lọc."); return; }
  if(fcState.mode === "speed"){
    startSpeedRound(deck);
    return;
  }
  fcState.deck = deck;
  fcState.idx = 0;
  fcState.session = { studied:0, correct:0, wrong:0 };
  fcRenderCurrent();
  fcUpdateSessionStats();
  toast("Bắt đầu phiên học : "+deck.length+" thẻ.");
}

function fcUpdateSessionStats(){
  const s = fcState.session;
  if($("#fcS1")) $("#fcS1").textContent = s.studied;
  if($("#fcS2")) $("#fcS2").textContent = s.correct;
  if($("#fcS3")) $("#fcS3").textContent = s.wrong;
  if($("#fcS4")) $("#fcS4").textContent = (s.studied ? Math.round(s.correct*100/s.studied)+"%" : "—");
}

function fcRenderCurrent(){
  const area = $("#fcArea"); if(!area) return;
  const mode = fcState.mode;

  if(mode === "speed"){ renderSpeedScreen(); return; }

  if(!fcState.deck.length){
    area.innerHTML = '<p class="muted">Nhấn « Bắt đầu phiên học » để bắt đầu.</p>';
    return;
  }
  const c = fcState.deck[fcState.idx];

  if(mode === "flip"){ renderFlip(area, c); return; }
  if(mode === "mcq"){ renderMCQ(area, c); return; }
  if(mode === "typing"){ renderTyping(area, c); return; }
  if(mode === "listening"){ renderListening(area, c); return; }
  if(mode === "matching"){ renderMatching(area); return; }
}

/* ---------- MCQ (Chọn nghĩa) ---------- */
function renderMCQ(area, c){
  if(fcState.idx !== fcState._lastIdx_mcq || !fcState.mcqOpts.length){
    fcState.mcqOpts = fcPickOpts(c, "v", 4);
    fcState._lastIdx_mcq = fcState.idx;
    fcState.answered = false;
    fcState.chosen = null;
  }
  const opts = fcState.mcqOpts;
  area.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row" style="gap:.35rem">
        <span class="tag">Leçon ${c.lesson}</span>${fcStatusChip(fcStatusOf(c))}</div>
      <span class="muted">Thẻ ${fcState.idx+1} / ${fcState.deck.length}</span>
    </div>
    <div class="progressbar"><i style="width:${Math.round((fcState.idx+1)*100/fcState.deck.length)}%"></i></div>
    <h3 style="margin-top:.8rem">Nghĩa tiếng Việt của « <span class="fr">${esc(c.w)}</span> » là gì ?</h3>
    <div class="muted" style="font-size:.9rem">${esc(c.ipa)} · ${esc(c.p)}</div>
    <div id="fcOpts" style="margin-top:.7rem"></div>
    <div id="fcFb"></div>
    <div class="row" style="justify-content:center;margin-top:.7rem">
      <button class="btn sec sm" id="fcSay">🔊 Nghe</button>
      <button class="btn sec sm" id="fcNext">Tiếp ➡️</button>
    </div>`;
  const wrap = $("#fcOpts"), fb = $("#fcFb");
  opts.forEach((o)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    if(fcState.answered){
      b.disabled = true;
      if(o.w === c.w) b.classList.add("correct");
      else if(fcState.chosen && fcState.chosen.w === o.w) b.classList.add("wrong");
    }
    b.innerHTML = `<span class="muted" style="margin-right:.4rem">›</span> ${esc(o.v)}`;
    b.addEventListener("click", ()=>{
      if(fcState.answered) return;
      fcState.answered = true; fcState.chosen = o;
      const ok = o.w === c.w;
      wrap.querySelectorAll(".opt").forEach(bb=>{
        bb.disabled = true;
        const ow = opts.find(x=>x.v === bb.textContent.replace("› ","").trim()) || opts[[...wrap.children].indexOf(bb)];
      });
      // Redraw classes properly
      [...wrap.children].forEach((bb,i)=>{
        bb.disabled = true;
        if(opts[i].w === c.w) bb.classList.add("correct");
        if(i !== opts.findIndex(x=>x.w===c.w) && opts[i].w === o.w) bb.classList.add("wrong");
      });
      fb.className = "fb "+(ok?"ok":"no");
      fb.innerHTML = (ok?"✅ Chính xác ! ":"❌ Chưa đúng. Đáp án : <strong>"+esc(c.v)+"</strong>. ")+"« "+esc(c.w)+" » = "+esc(c.v)+".";
      fcState.session.studied++; if(ok) fcState.session.correct++; else fcState.session.wrong++;
      fcUpdateSessionStats();
      recordAnswer({id:"fc-mcq-"+c.lesson+"-"+c.idx, lesson:c.lesson, skill:"vocab", topic:"Flashcard MCQ"},
        ok, o.v);
      speak(c.w);
    });
    wrap.appendChild(b);
  });
  if(fcState.answered){
    const idx = opts.findIndex(x=>x.w === c.w);
    [...wrap.children].forEach((bb,i)=>{
      bb.disabled = true;
      if(i === idx) bb.classList.add("correct");
      if(fcState.chosen && i !== idx && opts[i].w === fcState.chosen.w) bb.classList.add("wrong");
    });
    const ok = fcState.chosen && fcState.chosen.w === c.w;
    fb.className = "fb "+(ok?"ok":"no");
    fb.innerHTML = (ok?"✅ Chính xác ! ":"❌ Đáp án : <strong>"+esc(c.v)+"</strong>. ")+"« "+esc(c.w)+" » = "+esc(c.v)+".";
  }
  $("#fcSay").addEventListener("click", ()=>speak(c.w));
  $("#fcNext").addEventListener("click", ()=>fcNav(1));
}

function renderTyping(area, c){
  fcState.answered = false;
  fcState.typed = "";
  area.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row" style="gap:.35rem">
        <span class="tag">Leçon ${c.lesson}</span>${fcStatusChip(fcStatusOf(c))}</div>

    <div class="muted" style="font-size:.9rem">Gợi ý : ${esc(c.p)} · ${esc(c.ipa)}</div>
    <input type="text" id="fcTyped" placeholder="Nhập từ tiếng Pháp…" autocomplete="off" spellcheck="false" style="margin-top:.7rem">
    <div id="fcFb"></div>
    <div class="row" style="margin-top:.7rem">
      <button class="btn" id="fcCheck">Kiểm tra</button>
      <button class="btn sec sm" id="fcReveal">Xem đáp án</button>
      <button class="btn sec sm" id="fcSay">🔊 Nghe từ đúng</button>
      <button class="btn sec sm" id="fcNext" style="display:none">Tiếp ➡️</button>
    </div>`;
  const inp = $("#fcTyped"), fb = $("#fcFb");
  inp.focus();
  const finish = (ok, val)=>{
    fcState.answered = true; fcState.typed = val;
    fb.className = "fb "+(ok?"ok":"no");
    fb.innerHTML = (ok?"✅ Chính xác ! ":"❌ Chưa đúng. Đáp án : <strong>"+esc(c.w)+"</strong>. ")
      +"« "+esc(c.w)+" » = "+esc(c.v)+".";
    fcState.session.studied++; if(ok) fcState.session.correct++; else fcState.session.wrong++;
    fcUpdateSessionStats();
    recordAnswer({id:"fc-type-"+c.lesson+"-"+c.idx, lesson:c.lesson, skill:"vocab", topic:"Flashcard Typing"},
      ok, val);
    if(ok){ speak(c.w); } else { fcMarkFlag(c,"difficult"); }
    $("#fcCheck").disabled = true; $("#fcReveal").disabled = true;
    $("#fcNext").style.display = "inline-block";
  };
  const check = ()=>{
    if(fcState.answered) return;
    const v = inp.value.trim();
    if(!v){ toast("Hãy nhập câu trả lời."); return; }
    finish(looseEq(v, c.w), v);

/* ---------- MATCHING ---------- */
function renderMatching(area){
  if(!fcState.matching.pairs.length){
    const pool = fcState.deck.slice(0, Math.min(6, fcState.deck.length));
    fcState.matching.pairs = pool.map(p=>({fr:p.w, vi:p.v, lesson:p.lesson, w:p.w}));
    fcState.matching.left = shuffle(fcState.matching.pairs.map(p=>({type:"fr", w:p.fr, key:p.fr})));
    fcState.matching.right = shuffle(fcState.matching.pairs.map(p=>({type:"vi", w:p.vi, key:p.fr})));
    fcState.matching.matched = [];
    fcState.matching.selL = null;
    fcState.matching.selR = null;
    fcState.matching.wrongPair = null;
    fcState.matching.rounds = (fcState.matching.rounds||0) + 1;
  }
  const st = fcState.matching;
  area.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row" style="gap:.35rem">
        <span class="tag">Nối cặp</span>
        <span class="tag">Vòng ${st.rounds||1}</span>
        <span class="tag">${st.matched.length} / ${st.pairs.length}</span>
      </div>
      <button class="btn sec sm" id="fcNewRound">🔄 Vòng mới</button>
    </div>
    <p class="muted">Chọn một thẻ tiếng Pháp (trái) và một thẻ tiếng Việt (phải) tương ứng. Nối đúng sẽ tô xanh.</p>
    <div class="match-grid">
      <div class="match-col" id="mcolL"></div>
      <div class="match-col" id="mcolR"></div>
    </div>
    <div id="fcFb"></div>
    <div class="row" style="margin-top:.7rem">
      <button class="btn sec sm" id="fcNextRound" style="display:none">➡️ Vòng tiếp</button>
    </div>`;
  const colL = $("#mcolL"), colR = $("#mcolR"), fb = $("#fcFb");
  const draw = ()=>{
    colL.innerHTML = ""; colR.innerHTML = "";
    st.left.forEach(l=>{
      const b = document.createElement("button");
      b.className = "match-card" + (st.selL && st.selL.key === l.key ? " sel":"")
        + (st.matched.includes(l.key) ? " done":"");
      b.type="button";
      b.innerHTML = `<span class="fr">${esc(l.w)}</span>`;
      if(!st.matched.includes(l.key)) b.addEventListener("click", ()=>{ st.selL = l; fcTryMatch(); });
      colL.appendChild(b);
    });
    st.right.forEach(r=>{
      const b = document.createElement("button");
      b.className = "match-card" + (st.selR && st.selR.key === r.key ? " sel":"")
        + (st.matched.includes(r.key) ? " done":"");
      b.type="button";
      b.textContent = r.w;
      if(!st.matched.includes(r.key)) b.addEventListener("click", ()=>{ st.selR = r; fcTryMatch(); });
      colR.appendChild(b);
    });
    if(st.matched.length === st.pairs.length && st.pairs.length){
      fb.className = "fb ok";
      fb.innerHTML = "✅ Hoàn thành vòng nối cặp ! Tất cả đúng.";
      $("#fcNextRound").style.display = "inline-block";
    }
  };
  window.fcTryMatch = ()=>{
    if(!st.selL || !st.selR) { draw(); return; }
    const ok = st.selL.key === st.selR.key;
    const c = st.pairs.find(p=>p.fr === st.selL.key);
    fcState.session.studied++;
    if(ok){ fcState.session.correct++; st.matched.push(st.selL.key); fb.className = "fb ok";
      fb.innerHTML = "✅ Đúng : « "+esc(st.selL.w)+" » = « "+esc(st.selR.w)+" ».";
      if(c) fcMarkFlag({lesson:c.lesson, w:c.w},"known");
      speak(st.selL.w);
    } else {
      fcState.session.wrong++;
      fb.className = "fb no";
      fb.innerHTML = "❌ Chưa đúng. Hãy thử lại.";
      if(c) fcMarkFlag({lesson:c.lesson, w:c.w},"difficult");
    }
    fcUpdateSessionStats();
    st.selL = null; st.selR = null;
    draw();
  };
  draw();
  $("#fcNewRound").addEventListener("click", ()=>{
    fcState.matching.pairs = [];
    renderMatching(area);
  });
  $("#fcNextRound").addEventListener("click", ()=>{
    fcState.matching.pairs = [];
    renderMatching(area);
  });
}

/* ---------- SPEED ROUND ---------- */
function startSpeedRound(deck){
  if(!deck || !deck.length){ toast("Không có thẻ nào."); return; }
  fcState.speed = { timeLeft:60, timer:null, active:true, score:0, wrong:0, deck: shuffle(deck), idx:0, answered:false, chosen:null, opts:[] };
  fcTimer = setInterval(fcSpeedTick, 1000);
  renderSpeedScreen();
}
function stopSpeedRound(){
  if(fcTimer){ clearInterval(fcTimer); fcTimer = null; }
  fcState.speed.active = false;
}
function fcSpeedTick(){
  const sp = fcState.speed;
  if(!sp.active) { stopSpeedRound(); return; }
  sp.timeLeft--;
  if(sp.timeLeft <= 0){ sp.timeLeft = 0; stopSpeedRound(); fcSpeedFinish(); return; }
  const el = $("#fcSpeedTimer");
  if(el){
    el.textContent = sp.timeLeft+"s";
    el.className = "speed-timer" + (sp.timeLeft <= 10 ? " danger" : sp.timeLeft <= 20 ? " warn" : "");
  }
}
function renderSpeedScreen(){
  const sp = fcState.speed;
  if(!sp.active){ renderSpeedFinish(); return; }
  const c = sp.deck[sp.idx % sp.deck.length];
  if(!sp.opts.length || sp._lastFor !== sp.idx){
    sp.opts = fcPickOpts(c, "v", 4);
    sp._lastFor = sp.idx;
    sp.answered = false;
    sp.chosen = null;
  }
  $("#main").innerHTML = `
  <div class="card" style="text-align:center">
    <h2 style="margin:0">⚡ Đua tốc độ — 60 giây</h2>
    <div id="fcSpeedTimer" class="speed-timer">${sp.timeLeft}s</div>
    <div class="row" style="justify-content:center;gap:.8rem">
      <span class="fc-stat">Câu đúng: <strong>${sp.score}</strong></span>
      <span class="fc-stat">Câu sai: <strong>${sp.wrong}</strong></span>
      <span class="fc-stat">Chuỗi: <strong>${sp.streak||0}</strong></span>
    </div>
    <div class="progressbar" style="margin-top:.8rem"><i style="width:${Math.round(sp.timeLeft*100/60)}%"></i></div>
    <h3 style="margin-top:1rem">Nghĩa tiếng Việt của « <span class="fr">${esc(c.w)}</span> » ?</h3>
    <div id="fcSpeedOpts" style="max-width:520px;margin:.6rem auto 0"></div>
    <div class="row" style="justify-content:center;margin-top:.9rem">
      <button class="btn sec sm" id="fcSpeedStop">⏹️ Dừng sớm</button>
    </div>
  </div>`;
  const wrap = $("#fcSpeedOpts");
  sp.opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = `<span class="muted" style="margin-right:.4rem">${i+1}.</span> ${esc(o.v)}`;
    b.addEventListener("click", ()=>{
      if(sp.answered) return;
      sp.answered = true; sp.chosen = o;
      const ok = o.w === c.w;
      [...wrap.children].forEach((bb,ii)=>{
        bb.disabled = true;
        if(sp.opts[ii].w === c.w) bb.classList.add("correct");
        if(ii !== sp.opts.findIndex(x=>x.w===c.w) && sp.opts[ii].w === o.w) bb.classList.add("wrong");
      });
      if(ok){ sp.score++; sp.streak = (sp.streak||0)+1; }
      else { sp.wrong++; sp.streak = 0; fcMarkFlag(c,"difficult"); }
      recordAnswer({id:"fc-speed-"+c.lesson+"-"+c.idx, lesson:c.lesson, skill:"vocab", topic:"Speed Round"},
        ok, o.v);
      setTimeout(()=>{ sp.idx++; sp.opts=[]; if(sp.active) renderSpeedScreen(); }, 320);
    });
    wrap.appendChild(b);
  });
  $("#fcSpeedStop").addEventListener("click", ()=>{ stopSpeedRound(); fcSpeedFinish(); });
}
function fcSpeedFinish(){
  const sp = fcState.speed;
  $("#main").innerHTML = `
  <div class="card">
    <h2>🏁 Kết thúc đua tốc độ</h2>
    <div class="grid g3">
      <div class="stat"><div class="n">${sp.score}</div><div class="l">Câu đúng</div></div>
      <div class="stat"><div class="n">${sp.wrong}</div><div class="l">Câu sai</div></div>

      <button class="btn" id="fcSpeedAgain">🔁 Chơi lại</button>

/* ---------- HELPERS FLASHCARD ---------- */
function fcPickOpts(c, keyField, n){
  const others = shuffle(ALL_VOCAB.filter(x=>x[keyField] !== c[keyField] && norm(x[keyField]) !== norm(c[keyField]))).slice(0, n-1);
  return shuffle([c].concat(others));
}
function fcNav(delta){
  if(!fcState.deck.length) return;
  fcState.idx = (fcState.idx + delta + fcState.deck.length) % fcState.deck.length;
  // reset per-card state
  fcState.mcqOpts = []; fcState.listenOpts = [];
  fcState.answered = false; fcState.chosen = null;
  fcRenderCurrent();
}

function fcBuildAndStart(){ fcStart(); }

/* ------------------------- 23. QUIZ ENGINE ------------------------- */
let Q = null;
function openQuiz(questions, title){
  if(!questions || !questions.length){ toast("Không có câu hỏi phù hợp."); return; }
  Q = {qs:questions, i:0, correct:0, answered:false, title:title||"Luyện tập", results:[]};
  go("practice");
  renderQuiz();
}
function renderQuiz(){
  const main = $("#main");
  if(!Q){
    main.innerHTML = `<div class="card"><h2>✏️ Bài tập</h2>
      <p class="muted">Chọn một chế độ luyện tập bên dưới hoặc vào từng bài học.</p>
      <div class="row">
        <button class="btn" data-m="vocab">🔤 Từ vựng (20 câu)</button>
        <button class="btn sec" data-m="grammar">📐 Ngữ pháp (20 câu)</button>
        <button class="btn sec" data-m="comm">💬 Giao tiếp (15 câu)</button>
        <button class="btn sec" data-m="mix">🎯 Tổng hợp (25 câu)</button>
        <button class="btn ghost" data-m="trans">🌐 Dịch Việt → Pháp</button>
        <button class="btn ghost" data-m="order">🧩 Sắp xếp câu</button>
        <button class="btn ghost" data-m="flash">🃏 Flashcards</button>
      </div></div>`;
    main.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{
      const k = b.dataset.m;
      if(k==="vocab") openQuiz(pick(BANK.filter(q=>q.skill==="vocab" && q.type==="mcq"),20),"Từ vựng");
      else if(k==="grammar") openQuiz(pick(BANK.filter(q=>q.skill==="grammar"),20),"Ngữ pháp");
      else if(k==="comm") openQuiz(pick(BANK.filter(q=>q.skill==="communication"),15),"Giao tiếp");
      else if(k==="mix") openQuiz(pick(BANK,25),"Tổng hợp");
      else if(k==="trans") openQuiz(pick(BANK.filter(q=>q.type==="text"),12),"Dịch Việt → Pháp");
      else if(k==="order") openQuiz(pick(BANK.filter(q=>q.type==="order"),12),"Sắp xếp câu");
      else if(k==="flash") go("flashcards");
    }));
    return;
  }
  if(Q.i >= Q.qs.length){ renderQuizResult(); return; }
  const q = Q.qs[Q.i];
  const prog = Math.round(Q.i*100/Q.qs.length);
  main.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>${esc(Q.title)}</strong>
      <span class="muted">Câu ${Q.i+1} / ${Q.qs.length} · Đúng ${Q.correct}</span>
    </div>
    <div class="progressbar"><i style="width:${prog}%"></i></div>
    <div class="row" style="gap:.4rem">
      <span class="tag">Leçon ${q.lesson}</span>
      <span class="tag">${esc(q.topic)}</span>
      <span class="tag">${esc(skillLabel(q.skill))}</span>
    </div>
    <h3 style="margin-top:.8rem">${esc(q.q)}</h3>
    <div id="qArea"></div>
    <div id="fbArea"></div>
    <div class="row" style="margin-top:.9rem">
      <button class="btn" id="nextBtn" style="display:none">Câu tiếp ➡️</button>
      <button class="btn ghost sm" id="quitBtn">Thoát</button>
    </div>
  </div>`;
  $("#quitBtn").addEventListener("click",()=>{Q=null;renderQuiz();});
  const area = $("#qArea");
  if(q.type==="mcq"){
    q.options.forEach((opt,idx)=>{
      const b = document.createElement("button");
      b.className = "opt"; b.type="button"; b.textContent = opt;
      b.addEventListener("click",()=>{
        if(Q.answered) return;
        Q.answered = true;
        const ok = idx===q.answer;
        if(ok) Q.correct++;
        Q.results.push({q:q, ok:ok, user:opt});
        recordAnswer(q, ok, opt);
        area.querySelectorAll(".opt").forEach((bb,bi)=>{
          bb.disabled = true;
          if(bi===q.answer) bb.classList.add("correct");
          if(bi===idx && !ok) bb.classList.add("wrong");
        });
        showFeedback(ok, q, opt);
        $("#nextBtn").style.display = "inline-block";
        $("#nextBtn").focus();
      });
      area.appendChild(b);
    });
  } else if(q.type==="text"){
    area.innerHTML = `<input type="text" id="txtAns" placeholder="Nhập câu tiếng Pháp…" aria-label="Câu trả lời">
      <div class="row" style="margin-top:.6rem"><button class="btn" id="checkBtn">Kiểm tra</button>
      <button class="btn sec sm" id="revealBtn">Xem đáp án</button></div>`;
    const check = ()=>{
      if(Q.answered) return;
      Q.answered = true;
      const val = $("#txtAns").value;
      const ok = looseEq(val, q.answer);
      if(ok) Q.correct++;
      Q.results.push({q:q, ok:ok, user:val});
      recordAnswer(q, ok, val);
      showFeedback(ok, q, val);
      $("#nextBtn").style.display = "inline-block";
      $("#checkBtn").disabled = true;
    };
    $("#checkBtn").addEventListener("click",check);
    $("#txtAns").addEventListener("keydown",e=>{if(e.key==="Enter")check();});
    $("#revealBtn").addEventListener("click",()=>{
      if(Q.answered) return; Q.answered=true;
      recordAnswer(q,false,"(xem đáp án)");
      showFeedback(false,q,"");
      $("#nextBtn").style.display="inline-block";
    });
  } else if(q.type==="order"){
    const correct = q.words.slice();
    const shuffled = shuffle(correct);
    area.innerHTML = `<div class="drop" id="drop"></div>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:.6rem"><button class="btn" id="checkBtn">Kiểm tra</button>
      <button class="btn sec sm" id="undoBtn">↩️ Xóa hết</button></div>`;
    const drop = $("#drop"), chips = $("#chips");
    let placed = [];
    const draw = ()=>{
      drop.innerHTML = placed.map((w,i)=>`<span class="chip in" data-back="${i}">${esc(w)}</span>`).join("");
      chips.innerHTML = shuffled.map((w,i)=>`<span class="chip" data-fwd="${i}">${esc(w)}</span>`).join("");
      drop.querySelectorAll("[data-back]").forEach(el=>el.addEventListener("click",()=>{
        placed.splice(Number(el.dataset.back),1); draw();
      }));
      chips.querySelectorAll("[data-fwd]").forEach(el=>el.addEventListener("click",()=>{
        placed.push(shuffled[Number(el.dataset.fwd)]); draw();
      }));
    };
    draw();
    $("#undoBtn").addEventListener("click",()=>{placed=[];draw();});
    $("#checkBtn").addEventListener("click",()=>{
      if(Q.answered) return; Q.answered = true;
      const ans = placed.join(" ");
      const ok = norm(ans)===norm(q.answer);
      if(ok) Q.correct++;
      Q.results.push({q:q, ok:ok, user:ans});
      recordAnswer(q, ok, ans);
      showFeedback(ok, q, ans);
      $("#nextBtn").style.display = "inline-block";
      $("#checkBtn").disabled = true;
    });
  }
  $("#nextBtn").addEventListener("click",()=>{Q.i++; Q.answered=false; renderQuiz();});
}

function startFinalTest(){
  const vocab = pick(BANK.filter(q=>q.skill==="vocab" && q.type==="mcq"),15);
  const gram  = pick(BANK.filter(q=>q.skill==="grammar" && q.type==="mcq"),15);
  const comm  = pick(BANK.filter(q=>q.skill==="communication"),5);
  const read  = pick(BANK.filter(q=>q.skill==="reading"),3);
  const list  = pick(BANK.filter(q=>q.skill==="listening"),2);
  const qs = shuffle([].concat(vocab,gram,comm,read,list)).slice(0,40);
  finalTest = {active:true, qs:qs, i:0, correct:0, answers:[], endTime:Date.now()+30*60*1000, timer:null, locked:false};
  renderFinalTest();
  finalTest.timer = setInterval(()=>{
    if(!finalTest||!finalTest.active){clearInterval(finalTest.timer);return;}
    const left = Math.max(0, finalTest.endTime - Date.now());
    const el = $("#finalTimer");
    if(el){
      const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
      el.textContent = "⏱️ "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    }
    if(left<=0){ clearInterval(finalTest.timer); finishFinalTest(true); }
  },1000);
}

    <div class="row" style="margin-top:.9rem">
      <button class="btn" id="fNext" style="display:none">Câu tiếp ➡️</button>
      <button class="btn sec sm" id="fSubmit">Nộp bài</button>
    </div>
  </div>`;
  f.locked = false;
  const area = $("#fArea");
  if(q.type==="mcq"){
    q.options.forEach((opt,idx)=>{
      const b=document.createElement("button");
      b.className="opt";b.type="button";b.textContent=opt;
      b.addEventListener("click",()=>{
        if(f.locked) return; f.locked = true;
        area.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        const ok = idx===q.answer;
        if(ok) f.correct++;
        f.answers.push({q:q, user:opt, ok:ok});
        b.classList.add(ok?"correct":"wrong");
        if(!ok) area.querySelectorAll(".opt")[q.answer].classList.add("correct");
        $("#fNext").style.display="inline-block";
      });
      area.appendChild(b);
    });
  } else {
    area.innerHTML = `<input type="text" id="fTxt" placeholder="Nhập câu trả lời…">
      <button class="btn" id="fCheck" style="margin-top:.6rem">Xác nhận</button>`;
    $("#fCheck").addEventListener("click",()=>{
      if(f.locked) return; f.locked = true;
      const val = $("#fTxt").value;
      const ok = looseEq(val, q.answer);
      if(ok) f.correct++;
      f.answers.push({q:q, user:val, ok:ok});
      area.innerHTML = `<div class="fb ${ok?"ok":"no"}">${ok?"✅ Chính xác.":"❌ Đáp án đúng : <strong>"+esc(q.answer)+"</strong>"}</div>`;
      $("#fNext").style.display="inline-block";
    });
  }
  $("#fNext").addEventListener("click",()=>{f.locked=false;f.i++;renderFinalTest();});
  $("#fSubmit").addEventListener("click",()=>{
    confirmModal("Bạn muốn nộp bài kiểm tra ngay bây giờ ?",()=>finishFinalTest(false));
  });
}
function finishFinalTest(timeout){
  const f = finalTest;
  if(!f) return;
  clearInterval(f.timer);
  f.active = false;
  const total = f.answers.length;
  const p = pct(f.correct, total);
  state.finalResults.push({date:new Date().toLocaleString("vi-VN"), score:p, correct:f.correct, total:total});
  state.xp += f.correct*10;
  f.answers.forEach(a=>recordAnswer(a.q, a.ok, a.user));
  saveState();
  $("#main").innerHTML = `
  <div class="card">
    <h2>📊 Kết quả bài kiểm tra cuối khoá</h2>
    ${timeout?'<p class="fb no">⏰ Hết thời gian — bài đã được nộp tự động.</p>':""}
    <div class="stat" style="text-align:center;margin-top:.6rem">
      <div class="n">${p}%</div>
      <div class="l">${f.correct} / ${total} câu đúng</div>
    </div>
    <div class="progressbar" style="margin-top:.8rem"><i style="width:${p}%"></i></div>
    <h3>Xem lại đáp án</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>Bài</th><th>Câu hỏi</th><th>Bạn trả lời</th><th>Đáp án</th><th>Kết quả</th><th>Giải thích</th></tr></thead>
      <tbody>${f.answers.map((a,i)=>{
        const ans = a.q.type==="mcq" ? a.q.options[a.q.answer] : a.q.answer;
        return `<tr>
          <td>${i+1}</td><td>L${a.q.lesson}</td>
          <td>${esc(a.q.q)}</td>
          <td class="muted">${esc(a.user)}</td>
          <td class="fr">${esc(ans)}</td>
          <td>${a.ok?"✅":"❌"}</td>
          <td><small>${esc(a.q.explain||"")}</small></td>
        </tr>`;}).join("")}</tbody></table></div>
    <div class="row" style="margin-top:.9rem">
      <button class="btn" id="retryFinal">🔁 Làm lại</button>
      <button class="btn sec" id="toMistakes">❌ Ôn lỗi sai</button>
      <button class="btn ghost" id="toHome">🏠 Bảng điều khiển</button>
    </div>
  </div>`;
  finalTest = null;
  $("#retryFinal").addEventListener("click",()=>{renderFinal();startFinalTest();});
  $("#toMistakes").addEventListener("click",()=>go("mistakes"));
  $("#toHome").addEventListener("click",()=>go("dashboard"));
}

/* ------------------------- 32. PROGRESS ------------------------- */
function renderProgress(){
  const ov = overallStats();
  const known = ALL_VOCAB.filter(x=>(state.vocabStatus[x.lesson+"|"+x.w]||"").indexOf("known")>=0).length;
  const diff = ALL_VOCAB.filter(x=>(state.vocabStatus[x.lesson+"|"+x.w]||"").indexOf("difficult")>=0).length;
  const fav = ALL_VOCAB.filter(x=>(state.vocabStatus[x.lesson+"|"+x.w]||"").indexOf("fav")>=0).length;
  $("#main").innerHTML = `
  <div class="card">
    <h2>📈 Tiến độ học tập</h2>
    <div class="grid g3" style="margin-top:.6rem">
      <div class="stat"><div class="n">${ov.acc}%</div><div class="l">Độ chính xác tổng (${ov.c}/${ov.t})</div></div>
      <div class="stat"><div class="n">${state.xp}</div><div class="l">XP</div></div>
      <div class="stat"><div class="n">${state.streak}</div><div class="l">Chuỗi ngày học</div></div>
      <div class="stat"><div class="n">${state.sessions}</div><div class="l">Buổi học</div></div>
      <div class="stat"><div class="n">${known}/${ALL_VOCAB.length}</div><div class="l">Từ đánh dấu « biết »</div></div>
      <div class="stat"><div class="n">${diff}</div><div class="l">Từ đánh dấu « khó »</div></div>
      <div class="stat"><div class="n">${fav}</div><div class="l">Từ yêu thích</div></div>
      <div class="stat"><div class="n">${Object.values(state.mistakes).filter(m=>!m.resolved).length}</div><div class="l">Lỗi chưa khắc phục</div></div>
      <div class="stat"><div class="n">${state.finalResults.length}</div><div class="l">Lần kiểm tra cuối</div></div>
    </div>
  </div>
  <div class="card">
    <h3>Độ chính xác theo kỹ năng</h3>
    ${["vocab","grammar","reading","listening","communication"].map(sk=>{
      const s = state.stats[sk]||{c:0,t:0};
      return `<div style="margin:.5rem 0">
        <div class="row" style="justify-content:space-between"><span>${skillLabel(sk)}</span><span class="muted">${s.c}/${s.t} · ${pct(s.c,s.t)}%</span></div>
        <div class="bar"><i style="width:${pct(s.c,s.t)}%"></i></div></div>`;
    }).join("")}
  </div>
  <div class="card">
    <h3>Độ chính xác theo bài học</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Bài</th><th>Chủ đề</th><th>Đúng</th><th>Tổng</th><th>%</th><th>Tiến độ</th></tr></thead>
      <tbody>${LESSONS.map(L=>{
        const s = state.lessonStats[L.id]||{c:0,t:0};
        return `<tr>
          <td>Leçon ${L.id}</td><td>${esc(L.title)}</td><td>${s.c}</td><td>${s.t}</td><td>${pct(s.c,s.t)}%</td>
          <td style="min-width:120px"><div class="bar"><i style="width:${pct(s.c,s.t)}%"></i></div></td>
        </tr>`;}).join("")}
      </tbody></table></div>
  </div>
  <div class="card">
    <h3>Kết quả kiểm tra cuối khoá</h3>
    ${state.finalResults.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Ngày</th><th>Điểm</th><th>Đúng / Tổng</th></tr></thead>
      <tbody>${state.finalResults.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${r.score}%</td><td>${r.correct} / ${r.total}</td></tr>`).join("")}</tbody>
    </table></div>` : '<p class="muted">Chưa có lần kiểm tra nào.</p>'}
    <div class="row" style="margin-top:.8rem">
      <button class="btn sec" id="pgReset">🗑️ Xóa toàn bộ tiến độ</button>
    </div>
  </div>`;
  $("#pgReset").addEventListener("click",resetWithConfirm);
}

/* ------------------------- 33. SETTINGS ------------------------- */
function renderSettings(){
  $("#main").innerHTML = `
  <div class="card">
    <h2>⚙️ Cài đặt</h2>
    <div class="grid g2" style="margin-top:.6rem">
      <div>
        <h3>Giao diện</h3>
        <label class="row"><input type="checkbox" id="setDark" ${state.settings.dark?"checked":""}> Chế độ tối</label>
        <label style="display:block;margin-top:.7rem">Cỡ chữ : <span id="fsVal">${state.settings.font}px</span>
          <input type="range" id="setFont" min="14" max="22" step="1" value="${state.settings.font}" style="width:100%">
        </label>
        <label class="row" style="margin-top:.7rem"><input type="checkbox" id="setSound" ${state.settings.sound?"checked":""}> Bật âm thanh / phát âm</label>
      </div>
      <div>
        <h3>Dữ liệu</h3>
        <div class="row">
          <button class="btn sec" id="setClearMistakes">🗑️ Xóa danh sách lỗi sai</button>
          <button class="btn danger" id="setReset">🗑️ Xóa toàn bộ tiến độ</button>
        </div>
        <p class="muted" style="margin-top:.6rem">Dữ liệu được lưu trong LocalStorage.</p>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>ℹ️ Về ứng dụng</h3>
    <p><strong>French Learning Studio — Le Nouveau Taxi ! 1</strong><br>
    Leçons 7–12 | Vocabulaire • Grammaire • Compréhension • Communication</p>
    <p class="muted">Ứng dụng học tiếng Pháp dành cho sinh viên Việt Nam trình độ A1–A2. Toàn bộ bài tập, đoạn đọc,
    hội thoại nghe và bài viết mẫu là <strong>nội dung luyện tập gốc</strong> do ứng dụng tạo ra, không phải bản sao
    nguyên văn của sách giáo khoa và không phải đề thi chính thức.</p>
    <h4>Mẹo học tiếng Pháp</h4>
    <ul class="tight">
      <li>Học từ vựng theo cụm (un pantalon bleu) thay vì từ đơn lẻ.</li>
      <li>Luôn học danh từ kèm mạo từ (le/la/un/une) để nhớ giống.</li>
      <li>Luyện nghe 10 phút mỗi ngày hiệu quả hơn 2 giờ mỗi tuần.</li>
      <li>Nói to thành tiếng — đừng chỉ đọc thầm.</li>
      <li>Ôn lại lỗi sai sau mỗi buổi học.</li>
      <li>Dùng Flashcards mỗi ngày 5 phút để ghi nhớ từ vựng lâu dài.</li>
    </ul>
  </div>`;
  $("#setDark").addEventListener("change",e=>{state.settings.dark=e.target.checked;applySettings();saveState();});
  $("#setFont").addEventListener("input",e=>{
    state.settings.font = Number(e.target.value);
    $("#fsVal").textContent = state.settings.font+"px";
    applySettings(); saveState();
  });
  $("#setSound").addEventListener("change",e=>{
    state.settings.sound = e.target.checked; saveState();
    if(!e.target.checked && "speechSynthesis" in window) speechSynthesis.cancel();
  });
  $("#setClearMistakes").addEventListener("click",()=>{
    confirmModal("Xóa toàn bộ danh sách lỗi sai ?",()=>{state.mistakes={};saveState();toast("Đã xóa danh sách lỗi sai.");});
  });
  $("#setReset").addEventListener("click",resetWithConfirm);
}
function applySettings(){
  document.body.classList.toggle("dark", !!state.settings.dark);
  document.documentElement.style.setProperty("--fs", state.settings.font+"px");
}
function resetWithConfirm(){
  confirmModal("⚠️ Bạn có chắc muốn XÓA TOÀN BỘ tiến độ học tập ? Hành động này không thể hoàn tác.",()=>{
    localStorage.removeItem(LS_KEY);
    for(let i=0;i<WRITING.length;i++) localStorage.removeItem("fls_writing_"+i);
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    applySettings();
    Q = null; finalTest = null;
    fcState.deck = []; fcState.session = {studied:0,correct:0,wrong:0};
    stopSpeedRound();
    toast("Đã xóa toàn bộ tiến độ.");
    go("dashboard");
  });
}
function confirmModal(text, onOk){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <p style="margin-top:0">${esc(text)}</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn sec" id="mCancel">Hủy</button>
      <button class="btn danger" id="mOk">Xác nhận</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.querySelector("#mCancel").addEventListener("click",close);
  ov.querySelector("#mOk").addEventListener("click",()=>{close();onOk();});
  ov.addEventListener("click",e=>{if(e.target===ov) close();});
  ov.querySelector("#mOk").focus();
}

/* ------------------------- 34. INIT ------------------------- */
document.addEventListener("DOMContentLoaded",()=>{
  applySettings();
  $$(".navbtn").forEach(b=>b.addEventListener("click",()=>{
    if(Q && (b.dataset.nav!=="practice")) Q = null;
    if(fcState.speed.active && b.dataset.nav!=="flashcards") stopSpeedRound();
    go(b.dataset.nav);
  }));
  $("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
  $("#themeBtn").addEventListener("click",()=>{
    state.settings.dark = !state.settings.dark; applySettings(); saveState();
  });
  go("dashboard");
});
</script>
</body>
